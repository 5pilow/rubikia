<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Rubik'IA</title>
		<script src="jquery/jquery-2.1.1.min.js" type="text/javascript"></script>
		<script type="text/javascript" src="lib3dcube/virtualrubik.js"></script>
		<script type="text/javascript">includeVirtualRubik("lib3dcube");</script>
		<script type="text/javascript" src="index.js"></script>
		
		<!-- A faire en plus joli    -->
		<script type="text/javascript" src="baseStructs.js"></script>
		<script type="text/javascript" src="FaceCube.js"></script>
		<script type="text/javascript" src="CubieCube.js"></script>
		<script type="text/javascript" src="CoordCube.js"></script>
		<script type="text/javascript" src="search.js"></script>
		<script type="text/javascript" src="Tools.js"></script>
		
		<link href='style.css' rel='stylesheet' type='text/css'>
	</head>

	<body onLoad="init()">

		<canvas id="canvas" class="virtualrubik" width="500" height="500"></canvas>

		<div id='update_buttons'>
			<button id='update_3d'>&lt;&lt;&lt;</button>
			<br>
			<button id='update_2d'>&gt;&gt;&gt;</button>
		</div>

		<div id='faces'>
			<div class='face top'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div><div class='face left'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div><div class='face front'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div><div class='face right'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div><div class='face back'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div><div class='face bottom'>
				<span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span><span class='tile'></span>
			</div>

			<div id='colors'>
				<span class='color red selected'></span><span class='color yellow'></span><span class='color blue'></span><span class='color orange'></span><span class='color white'></span><span class='color green'></span>
			</div>
		</div>

		<br>
		<br>
		<center>
			<input id='script' type='text'>
			<input id='max-moves' type='number' value='21'>
			<input id='time' type='number' value='5000'>
			<span id='moves'></span>
			<br>
			<button id='reset'>Reset</button>
			<button id='solve'>Solve</button>
			<button id='move'>Execute</button>
		</center>

	</body>
</html>
